<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel Archive</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mut:#86868b;--bd:rgba(0,0,0,.09);--ac:#0071e3;--ok:#30d158;--okbg:rgba(48,209,88,.12);--nav:rgba(251,251,253,.8);--ph:#ececf0;--sh:0 2px 12px rgba(0,0,0,.05)}
[data-theme=dark]{--bg:#09090c;--card:#14151a;--tx:#f5f5f7;--mut:#98989d;--bd:rgba(255,255,255,.1);--ac:#2997ff;--okbg:rgba(48,209,88,.16);--nav:rgba(10,10,13,.78);--ph:#1e2027;--sh:none}
:root{--night:radial-gradient(ellipse 75% 45% at 50% 108%,rgba(30,32,42,.95),transparent 72%),linear-gradient(180deg,#09090c 0%,#09090b 42%,#0c0d10 72%,#0f1015 100%)}
[data-theme=dark] body{background:var(--night) fixed,#09090c}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
header{position:sticky;top:0;z-index:20;height:48px;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px}
header a,.dd>span{color:var(--tx);text-decoration:none;font-size:13px;padding:6px 14px;border-radius:980px;cursor:pointer;opacity:.85}
header a:hover,.dd:hover>span{opacity:1;background:var(--bd)}
.dd{position:relative}.menu{display:none;position:absolute;top:34px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.dd:hover .menu{display:block}.menu:before{content:"";position:absolute;top:-8px;left:0;right:0;height:8px}
.menu .grp{padding:8px 14px 4px;font-size:11px;color:var(--mut);font-weight:600}.menu a{display:block;border-radius:8px}
#theme{border:0;background:none;font-size:17px;cursor:pointer;padding:4px 8px;border-radius:50%;margin-left:8px}#theme:hover{background:var(--bd)}
main{max-width:1180px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:40px;font-weight:700;letter-spacing:-.025em;margin:0 0 6px}.sub{color:var(--mut);font-size:17px;margin-bottom:32px}
h2{font-size:24px;letter-spacing:-.02em;margin:40px 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.stat{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--sh)}.stat b{font-size:40px;font-weight:700;letter-spacing:-.03em;display:block}.stat span{color:var(--mut);font-size:14px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.set{background:var(--card);border-radius:20px;padding:22px;text-decoration:none;color:inherit;display:block;box-shadow:var(--sh);transition:transform .2s}.set:hover{transform:scale(1.025)}
.set h3{margin:0;font-size:21px;letter-spacing:-.02em}.set small{color:var(--mut);font-size:13px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .4s}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:24px 0}
.seg{display:inline-flex;background:var(--bd);border-radius:9px;padding:2px}.seg button{border:0;background:none;color:var(--tx);font:inherit;font-size:13px;padding:6px 16px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15);font-weight:600}
input,select,textarea{font:inherit;font-size:14px;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.c{position:relative;background:var(--card);border:3px solid transparent;border-radius:9px;padding:14px;box-shadow:var(--sh);transition:all .25s}
.c.own{border-color:var(--ok);background:linear-gradient(var(--okbg),var(--okbg)),var(--card);box-shadow:0 0 0 4px rgba(48,209,88,.28),0 10px 30px rgba(48,209,88,.3)}
.c.own:after{content:"✓";position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.img{aspect-ratio:59/86;border-radius:5px;background:var(--ph);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--mut);padding:10px;cursor:pointer}
.img img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font-size:14px;font-weight:600;margin:10px 0 2px;min-height:36px;letter-spacing:-.01em}.no{font-size:12px;color:var(--mut)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.f label{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);display:block;margin-bottom:2px}
.f select,.f input{width:100%;padding:6px 8px;font-size:13px;border-radius:8px}
.own .p select{border-color:var(--ok);color:var(--ok);font-weight:700}
.more{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap}.more details{background:var(--card);border-radius:16px;padding:16px 20px;flex:1;min-width:280px}
.more summary{cursor:pointer;font-weight:600}.more .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.more textarea{width:100%;min-height:110px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:980px;padding:8px 18px;cursor:pointer;font:inherit;font-size:14px}
.del{position:absolute;top:6px;left:8px;border:0;background:none;color:var(--mut);cursor:pointer;z-index:2}
.ib{display:flex;gap:6px;margin-top:8px}.ib button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:4px 0;cursor:pointer;font-size:13px}.ib button:hover{border-color:var(--ac)}
.reorder .f,.reorder .ib{display:none}.reorder .c{cursor:grab}.reorder .img{pointer-events:none}
.c.dragging{opacity:.35;transform:scale(.96)}.c.over{outline:3px dashed var(--ac);outline-offset:3px}
.mv{display:none;gap:6px;margin-top:8px}.reorder .mv{display:flex}.mv button{flex:1;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:6px 0;cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.on{background:var(--ok)}
.dd.open .menu{display:block}.menu{max-height:70vh;overflow:auto}
@media(max-width:600px){h1{font-size:30px}.sub{font-size:15px}main{padding:28px 14px 60px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.sets{grid-template-columns:1fr}.c{padding:8px}.nm{font-size:13px}}
.brand{text-align:center;padding:26px 16px 20px}.brand a{font-size:28px;font-weight:800;letter-spacing:.38em;padding-left:.38em;color:var(--tx);text-decoration:none}
.set{position:relative}.set .x{display:none;position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#ff453a;color:#fff;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.delmode .set .x{display:flex}.delmode .set{outline:2px dashed #ff453a;outline-offset:-2px}.delmode .set:hover{transform:none}
#hq{min-width:220px}
@media(max-width:600px){.brand a{font-size:20px;letter-spacing:.25em}}
body.pre{overflow:hidden;height:100vh}
.brand,header,main{transition:opacity .9s .2s ease,transform 1.1s .2s cubic-bezier(.32,.72,0,1)}
body.pre .brand,body.pre main{opacity:0;transform:translateY(18px) scale(.985)}body.pre header{opacity:0}
.brand a{display:inline-flex;align-items:center;gap:16px}
.lg{width:54px;height:45px;border-radius:12px;overflow:hidden;background:#0b0b0e;box-shadow:0 4px 14px rgba(0,0,0,.25);display:block;flex:none}.lg img{width:100%;height:100%;object-fit:cover;display:block}
#splash{position:fixed;inset:0;z-index:100;background:#161616;display:flex;align-items:center;justify-content:center;cursor:pointer;clip-path:inset(0 0 0 0);transition:clip-path 1.25s cubic-bezier(.76,0,.24,1)}
.sp-in{text-align:center;animation:spIn 1.6s cubic-bezier(.16,1,.3,1) both;transition:transform 1.1s cubic-bezier(.32,.72,0,1),opacity .9s,filter 1s}
#splash img{width:min(68vw,340px);height:auto;display:block;margin:0 auto;-webkit-mask-image:radial-gradient(ellipse at center,#000 52%,transparent 97%);mask-image:radial-gradient(ellipse at center,#000 52%,transparent 97%)}
.sp-hint{font-size:14px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;padding-left:.14em;background:linear-gradient(100deg,#8e8e93 0%,#8e8e93 40%,#fff 50%,#8e8e93 60%,#8e8e93 100%);background-size:300% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;transition:letter-spacing .9s cubic-bezier(.32,.72,0,1),filter .6s}
#splash img{transition:filter .8s ease}
#splash.go .sp-hint{animation:shine .85s ease-in-out forwards;letter-spacing:.26em;filter:drop-shadow(0 0 10px rgba(255,255,255,.85))}
#splash.go img{filter:brightness(1.3) drop-shadow(0 0 34px rgba(170,185,255,.4))}
#splash.out{clip-path:inset(0 0 0 100%);pointer-events:none}#splash.out .sp-in{transform:translateX(-50px);opacity:0}
#splash.out .sw{left:100%;opacity:1}
@keyframes spIn{from{opacity:0;transform:scale(.92);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;animation-delay:0s!important}}
.brand{padding:0;text-align:initial}
.hero{display:block;height:clamp(190px,27vw,400px);overflow:hidden;background:var(--bg);-webkit-mask-image:linear-gradient(#000 74%,transparent);mask-image:linear-gradient(#000 74%,transparent)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;will-change:transform,opacity;transform-origin:50% 40%}
.brand .hero{display:block;width:100%;aspect-ratio:2048/507;min-height:190px;max-height:620px;height:auto;gap:0;-webkit-mask-image:linear-gradient(#000 52%,transparent 100%);mask-image:linear-gradient(#000 52%,transparent 100%)}
header{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid transparent;transition:background .35s,border-color .35s}
header.sc{background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--bd)}
.iw{position:relative}.rb{position:absolute;left:7px;bottom:7px;width:38px;height:auto;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none}
.cb{position:absolute;right:7px;bottom:7px;width:34px;height:auto;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none}
.menu a{position:relative;transition:transform .25s cubic-bezier(.32,.72,0,1),color .2s,background .2s}
.menu a:hover{transform:translateX(5px);color:var(--ac)}
.menu a:after{content:"›";position:absolute;right:12px;top:50%;margin-top:-10px;opacity:0;transform:translateX(-6px);transition:all .25s}
.menu a:hover:after{opacity:.6;transform:none}
.dd:hover .menu,.dd.open .menu{animation:mIn .28s cubic-bezier(.32,.72,0,1)}
@keyframes mIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%)}}
.set h3{transition:transform .25s cubic-bezier(.32,.72,0,1)}.set:hover h3{transform:translateX(4px)}
.iw{transition:transform .6s cubic-bezier(.22,1,.36,1),box-shadow .6s cubic-bezier(.22,1,.36,1);will-change:transform}.iw:hover{transform:scale(1.24) translateY(-5px);z-index:6;box-shadow:0 24px 50px rgba(0,0,0,.45)}
@media(hover:none){.iw:hover{transform:none;box-shadow:none}}
.reorder .iw:hover{transform:none;box-shadow:none}
.rb,.cb{position:absolute;bottom:8px;width:46px;height:30px;object-fit:fill;border-radius:3px;box-shadow:0 1px 5px rgba(0,0,0,.5);pointer-events:none}
.cb{left:8px;right:auto}.rb{right:8px;left:auto}
.ib{flex-wrap:wrap}.ib button{font-size:12px;min-width:34px}
.sp-line{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 auto;width:min(72vw,300px);color:#6f717c}
.sp-line span{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3))}.sp-line span:last-child{background:linear-gradient(270deg,transparent,rgba(255,255,255,.3))}
.sp-line i{font-style:normal;font-size:11px}
.sp-tag{font-size:11px;letter-spacing:.34em;padding-left:.34em;color:#7d7f8a;margin-top:18px;text-transform:uppercase}
.sp-hint{margin-top:34px;font-size:12px}
.sp-foot{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.42em;padding-left:.42em;color:#4d4f59;text-transform:uppercase}... (3 Mo restants)
